<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Training framework -->
  <rect x="60" y="28" width="280" height="64" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="200" y="58" text-anchor="middle" font-size="16" font-weight="600" fill="#202124">Training framework</text>
  <text x="200" y="79" text-anchor="middle" font-size="11.5" fill="#5f6368">snnTorch · Norse · Sinabs · Lava-DL …</text>

  <!-- export arrow -->
  <line x1="200" y1="94" x2="200" y2="144" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="123" text-anchor="start" font-size="12" font-style="italic" fill="#5f6368">export</text>

  <!-- portable NIR file -->
  <rect x="60" y="146" width="280" height="64" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="200" y="176" text-anchor="middle" font-size="16" font-weight="600" fill="#202124" font-family="'SFMono-Regular','Consolas',monospace">model.nir</text>
  <text x="200" y="197" text-anchor="middle" font-size="11.5" fill="#5f6368">one portable NIR file</text>

  <!-- read & convert arrow -->
  <line x1="200" y1="212" x2="200" y2="262" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="241" text-anchor="start" font-size="12" font-style="italic" fill="#5f6368">read &amp; convert</text>

  <!-- py-spinnaker2 network -->
  <rect x="60" y="264" width="280" height="64" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="200" y="294" text-anchor="middle" font-size="15" font-weight="600" fill="#202124" font-family="'SFMono-Regular','Consolas',monospace">spinnaker2.snn.Network</text>
  <text x="200" y="315" text-anchor="middle" font-size="11.5" fill="#5f6368">run on SpiNNaker2 / Brian2</text>

  <!-- zone guides: framework (train + export) | neutral .nir handoff | py-spinnaker2 (read + convert + run) -->
  <line x1="360" y1="30" x2="360" y2="144" stroke="#dadce0" stroke-width="1.5"/>
  <text transform="rotate(-90 378 87)" x="378" y="87" text-anchor="middle" font-size="10.5" font-style="italic" fill="#9aa0a6">trained elsewhere</text>
  <line x1="360" y1="212" x2="360" y2="326" stroke="#dadce0" stroke-width="1.5"/>
  <text transform="rotate(-90 378 269)" x="378" y="269" text-anchor="middle" font-size="10.5" font-style="italic" fill="#9aa0a6">py-spinnaker2</text>
</svg>
