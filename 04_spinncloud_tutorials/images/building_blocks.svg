<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Population (pre) -->
  <rect x="30" y="25" width="180" height="60" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="120" y="52" text-anchor="middle" font-size="17" font-weight="600" fill="#202124">Population</text>
  <text x="120" y="71" text-anchor="middle" font-size="12.5" fill="#5f6368">pre</text>

  <!-- Projection -->
  <rect x="290" y="25" width="180" height="60" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="380" y="62" text-anchor="middle" font-size="17" font-weight="600" fill="#202124">Projection</text>

  <!-- Population (post) -->
  <rect x="550" y="25" width="180" height="60" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="640" y="52" text-anchor="middle" font-size="17" font-weight="600" fill="#202124">Population</text>
  <text x="640" y="71" text-anchor="middle" font-size="12.5" fill="#5f6368">post</text>

  <!-- pre -> projection -> post -->
  <line x1="210" y1="55" x2="290" y2="55" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="55" x2="550" y2="55" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- join lines down to Network -->
  <path d="M120 85 L120 135 L380 135" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <path d="M640 85 L640 135 L380 135" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <path d="M380 85 L380 135" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="380" y1="135" x2="380" y2="198" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="398" y="128" text-anchor="start" font-size="12" font-style="italic" fill="#5f6368">added to</text>

  <!-- Network -->
  <rect x="290" y="200" width="180" height="60" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="380" y="237" text-anchor="middle" font-size="17" font-weight="600" fill="#202124">Network</text>

  <!-- run on -->
  <line x1="470" y1="230" x2="550" y2="230" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="220" text-anchor="middle" font-size="12" font-style="italic" fill="#5f6368">run on</text>

  <!-- Backend -->
  <rect x="550" y="200" width="195" height="60" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="647" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">SpiNNaker2 /</text>
  <text x="647" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Brian2 backend</text>

  <!-- number badges (Population shares 1) -->
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="30" cy="25" r="13" fill="#4285f4"/><text x="30" y="30">1</text>
    <circle cx="550" cy="25" r="13" fill="#4285f4"/><text x="550" y="30">1</text>
    <circle cx="290" cy="25" r="13" fill="#34a853"/><text x="290" y="30">2</text>
    <circle cx="290" cy="200" r="13" fill="#f9ab00"/><text x="290" y="205">3</text>
    <circle cx="550" cy="200" r="13" fill="#ea4335"/><text x="550" y="205">4</text>
  </g>
</svg>
